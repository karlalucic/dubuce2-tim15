[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dubuce2-tim15"
version = "0.1.0"
description = "Diffusion-model scenario generation for portfolio VaR/ES (FER Deep Learning 2, Team 15)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch",
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "requests",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
